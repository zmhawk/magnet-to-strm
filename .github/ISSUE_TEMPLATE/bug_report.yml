name: Bug 报告
description: 报告可复现的错误
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 提交前请移除 Token、磁链、文件名、目录结构等敏感信息。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 发布版本、镜像标签或 commit SHA
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 运行方式
      options:
        - Docker / Docker Compose
        - 本地编译
        - 其他
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已移除凭据和个人内容信息。
          required: true
        - label: 这不是未公开的安全漏洞。
          required: true
