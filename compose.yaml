name: magnet-to-strm

services:
  magnet-to-strm:
    image: ghcr.io/zmhawk/magnet-to-strm:latest
    restart: unless-stopped
    init: true
    environment:
      PUID: "${PUID:-}"
      PGID: "${PGID:-}"
      MTS_HTTP_LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./cache:/cache
      - ./config:/etc/magnet-to-strm
    security_opt:
      - no-new-privileges:true
